<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cortesías · Colombia Tech Week</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Colombia Tech Week</p>
          <h1>Cortesías redimidas</h1>
          <p class="subtitle">Listado en vivo de cortesías ya redimidas en el evento.</p>
        </div>
        <div class="hero-status">
          <span id="statusBadge" class="status-badge">Cargando…</span>
          <button id="refreshButton" class="ghost-btn" type="button">Actualizar</button>
        </div>
      </header>

      <div id="errorBanner" class="error-banner hidden">
        <span id="errorMessage"></span>
        <button id="retryButton" class="ghost-btn" type="button">Reintentar</button>
      </div>

      <section class="stats-grid">
        <article class="card stat-card">
          <span>Total redimidas</span>
          <strong id="totalCount">–</strong>
        </article>
      </section>

      <section class="card chart-card">
        <div class="card-header">
          <h2>Distribución por rol</h2>
        </div>
        <div id="roleChart" class="role-chart"></div>
      </section>

      <section class="card table-card">
        <div class="card-header controls">
          <h2>Cortesías redimidas</h2>
          <div class="control-group">
            <input id="searchInput" type="search" placeholder="Buscar por nombre, empresa, correo o cédula" />
            <select id="roleFilter">
              <option value="">Todos los roles</option>
            </select>
            <button id="exportButton" class="ghost-btn" type="button">Exportar CSV</button>
          </div>
        </div>
        <p id="resultCount" class="result-count"></p>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Asistente</th>
                <th>Rol</th>
                <th>Empresa / Cargo</th>
                <th>Ubicación</th>
                <th>Correo</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
